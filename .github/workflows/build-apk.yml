name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish the GitHub Release the app updates from

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # The run number becomes the app's versionCode, so each build is newer than the last.
      - name: Build debug APK
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }} --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk nihongo-tracker.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nihongo-tracker-debug-apk
          path: nihongo-tracker.apk
          if-no-files-found: error

      # The app checks the latest release for "build-<n>" with n > its own versionCode.
      - name: Publish release (what the in-app updater reads)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: nihongo-tracker.apk
          make_latest: true

      # Runs last so a failing test never blocks the APK or the release.
      - name: Unit tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace
